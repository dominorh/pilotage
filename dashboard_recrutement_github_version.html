<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
<script src="supabase-config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="auth.js" data-acces="membre"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMINO RH — Dashboard recrutement</title>
    
    <!-- Tailwind CSS pour le style -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel pour compiler le JSX dans le navigateur -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Prop-Types (requis par certaines versions de Recharts) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <!-- Recharts pour les graphiques -->
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>

    <!-- Librairies utilitaires (XLSX et HTML2PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
/* Charte DOMINO RH */
body{background:#f5f6f9!important;color:#232323}
.bg-slate-800{background-color:#142469!important}.text-blue-500{color:#ed4018!important}.text-blue-600{color:#142469!important}.bg-blue-100{background-color:#fce8e2!important}.text-emerald-600{color:#142469!important}.bg-emerald-100{background-color:#e9edf8!important}.text-purple-600{color:#ed4018!important}.bg-purple-100{background-color:#fff0eb!important}
.border-slate-100,.divide-slate-100{border-color:#e0e3eb!important}.bg-slate-50{background-color:#f5f6f9!important}
</style>
</head>
<body class="bg-slate-50 min-h-screen">
    
    <!-- Point de montage de l'application React -->
    <div id="root"></div>

    <script type="text/babel">
        // Importation des hooks React depuis l'objet global
        const { useState, useMemo, useCallback, useEffect, useRef } = React;
        // Importation des composants Recharts depuis l'objet global
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = Recharts;

        const COLORS = ['#142469', '#ed4018', '#9b9b9b', '#263b86', '#f28a6b', '#6c78a8', '#c9ccd6', '#a63218'];

        // Composants SVG personnalisés pour remplacer lucide-react et rester dans 1 seul fichier
        const IconActivity = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        );
        const IconDownload = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        );
        const IconUploadCloud = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path><polyline points="16 16 12 12 8 16"></polyline></svg>
        );
        const IconFileSpreadsheet = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M8 13h2"></path><path d="M8 17h2"></path><path d="M14 13h2"></path><path d="M14 17h2"></path></svg>
        );
        const IconFilter = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        );
        const IconTarget = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
        );
        const IconUsers = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        );
        const IconBriefcase = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        );
        const IconFolder = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
        );

        function RecruitmentDashboard() {
            const [data, setData] = useState([]);
            const [isDragging, setIsDragging] = useState(false);
            const dashboardRef = useRef(null);
            
            // Filtres
            const [selectedTeam, setSelectedTeam] = useState('All');
            const [selectedUser, setSelectedUser] = useState('All');
            const [selectedPeriod, setSelectedPeriod] = useState('All');

            const exportToPDF = () => {
                if (!window.html2pdf) {
                    alert("La librairie d'export PDF n'est pas chargée.");
                    return;
                }
                const element = dashboardRef.current;
                const opt = {
                    margin:       0.3,
                    filename:     `Dashboard_Recrutement_${new Date().toISOString().split('T')[0]}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
                };
                window.html2pdf().set(opt).from(element).save();
            };

            const extractPeriodFromFilename = (filename) => {
                const weekRegex = /(?:S|Semaine|Sem)[\s_.-]*(\d{1,2})/i;
                const match = filename.match(weekRegex);
                
                if (match && match[1]) {
                    const weekNumber = parseInt(match[1], 10);
                    return `Semaine ${weekNumber}`;
                }
                return 'Période inconnue';
            };

            const processExcelFile = async (file) => {
                return new Promise((resolve, reject) => {
                    if (!window.XLSX) {
                        reject(new Error("La librairie XLSX n'est pas chargée."));
                        return;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const buffer = e.target.result;
                            const workbook = window.XLSX.read(buffer, { type: 'array' });
                            const sheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[sheetName];
                            
                            const rows = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                            
                            const parsedData = [];
                            let currentAction = '';
                            let currentTeam = '';
                            let currentConsultant = '';
                            let currentCible = '';

                            const filePeriod = extractPeriodFromFilename(file.name);

                            // Forward fill logic
                            for (let i = 5; i < rows.length; i++) {
                                const row = rows[i];
                                if (!row || row.length < 5) continue;

                                if (row[0] && row[0] !== '') currentAction = String(row[0]).trim();
                                if (row[1] && row[1] !== '') currentTeam = String(row[1]).trim();
                                if (row[2] && row[2] !== '') currentConsultant = String(row[2]).trim();
                                if (row[3] && row[3] !== '') currentCible = String(row[3]).trim();

                                const targetName = String(row[4] || '').trim();
                                const value = parseInt(row[5], 10) || 0;

                                if (targetName && targetName.toLowerCase() !== 'total' && value > 0) {
                                    parsedData.push({
                                        id: `${file.name}-${i}`,
                                        filename: file.name,
                                        period: filePeriod,
                                        action: currentAction,
                                        team: currentTeam,
                                        consultant: currentConsultant,
                                        cible: currentCible,
                                        targetName: targetName,
                                        value: value
                                    });
                                }
                            }
                            resolve(parsedData);
                        } catch (err) {
                            reject(err);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                });
            };

            const onFilesDrop = useCallback(async (e) => {
                e.preventDefault();
                setIsDragging(false);
                
                let files = [];
                if (e.dataTransfer && e.dataTransfer.files) {
                    files = Array.from(e.dataTransfer.files);
                } else if (e.target && e.target.files) {
                    files = Array.from(e.target.files);
                }

                const excelFiles = files.filter(f => f.name.endsWith('.xlsx') || f.name.endsWith('.xls'));
                if (excelFiles.length === 0) return;

                try {
                    const allNewData = await Promise.all(excelFiles.map(processExcelFile));
                    const flatNewData = allNewData.flat();
                    setData(flatNewData);
                } catch (error) {
                    console.error("Erreur lors du traitement des fichiers:", error);
                }
            }, []);

            const filteredData = useMemo(() => {
                return data.filter(item => {
                    const matchTeam = selectedTeam === 'All' || item.team === selectedTeam;
                    const matchUser = selectedUser === 'All' || item.consultant === selectedUser;
                    const matchPeriod = selectedPeriod === 'All' || item.period === selectedPeriod;
                    return matchTeam && matchUser && matchPeriod;
                });
            }, [data, selectedTeam, selectedUser, selectedPeriod]);

            const teams = useMemo(() => ['All', ...new Set(data.map(d => d.team).filter(Boolean))], [data]);
            const periods = useMemo(() => {
                const sortedPeriods = [...new Set(data.map(d => d.period).filter(Boolean))].sort((a, b) => {
                    const numA = parseInt(a.replace('Semaine ', '')) || 0;
                    const numB = parseInt(b.replace('Semaine ', '')) || 0;
                    return numA - numB;
                });
                return ['All', ...sortedPeriods];
            }, [data]);
            
            const consultants = useMemo(() => {
                const relevantData = selectedTeam === 'All' ? data : data.filter(d => d.team === selectedTeam);
                return ['All', ...new Set(relevantData.map(d => d.consultant).filter(Boolean))];
            }, [data, selectedTeam]);

            const stats = useMemo(() => {
                const totalActions = filteredData.reduce((sum, item) => sum + item.value, 0);
                const uniqueTargets = new Set(filteredData.map(item => item.targetName)).size;
                const activeConsultants = new Set(filteredData.map(item => item.consultant)).size;
                return { totalActions, uniqueTargets, activeConsultants };
            }, [filteredData]);

            const barChartData = useMemo(() => {
                const grouped = filteredData.reduce((acc, item) => {
                    if (!acc[item.consultant]) {
                        acc[item.consultant] = { name: item.consultant, commercial: 0, recrutement: 0, total: 0 };
                    }
                    if (item.cible && item.cible.toLowerCase() === 'client') {
                        acc[item.consultant].commercial += item.value;
                    } else {
                        acc[item.consultant].recrutement += item.value;
                    }
                    acc[item.consultant].total += item.value;
                    return acc;
                }, {});
                return Object.values(grouped).sort((a, b) => b.total - a.total).slice(0, 10);
            }, [filteredData]);

            const pieChartData = useMemo(() => {
                const grouped = filteredData.reduce((acc, item) => {
                    if (!acc[item.action]) acc[item.action] = { name: item.action, value: 0 };
                    acc[item.action].value += item.value;
                    return acc;
                }, {});
                return Object.values(grouped).sort((a, b) => b.value - a.value);
            }, [filteredData]);

            return (
                <div className="min-h-screen p-6 font-sans">
                    <div className="max-w-7xl mx-auto space-y-6" ref={dashboardRef}>
                        
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-100 gap-4 data-html2canvas-ignore">
                            <div className="flex-1">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h1 className="text-3xl font-bold text-slate-800 flex items-center gap-3">
                                            <IconActivity className="w-8 h-8 text-blue-500" />
                                            Dashboard Recrutement
                                        </h1>
                                        <p className="text-slate-500 mt-1 ml-11">Consolidation et analyse des activités d'équipe</p>
                                    </div>
                                    
                                    {data.length > 0 && (
                                        <button 
                                            onClick={exportToPDF}
                                            className="hidden md:flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg transition-colors text-sm font-medium"
                                        >
                                            <IconDownload className="w-4 h-4" />
                                            Exporter PDF
                                        </button>
                                    )}
                                </div>
                            </div>
                            
                            <div className="flex gap-2">
                                <div 
                                    className={`relative overflow-hidden border-2 border-dashed rounded-xl p-5 transition-all flex flex-col items-center justify-center min-w-[200px]
                                        ${isDragging ? 'border-blue-500 bg-blue-50 scale-105' : 'border-slate-300 bg-white hover:border-blue-400'} cursor-pointer`}
                                    onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                                    onDragLeave={() => setIsDragging(false)}
                                    onDrop={onFilesDrop}
                                >
                                    <input 
                                        type="file" multiple accept=".xlsx, .xls" 
                                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                        onChange={onFilesDrop}
                                    />
                                    <IconUploadCloud className={`w-6 h-6 mb-2 ${isDragging ? 'text-blue-600' : 'text-blue-500'}`} />
                                    <span className="font-medium text-xs text-center text-slate-600">
                                        Fichiers isolés
                                    </span>
                                </div>

                                <div className="relative overflow-hidden border-2 border-slate-200 rounded-xl p-5 transition-all flex flex-col items-center justify-center min-w-[200px] bg-slate-50 hover:bg-slate-100 hover:border-slate-300 cursor-pointer">
                                    <input 
                                        type="file" webkitdirectory="" directory=""
                                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                        onChange={onFilesDrop}
                                    />
                                    <IconFolder className="w-6 h-6 mb-2 text-slate-500" />
                                    <span className="font-medium text-xs text-center text-slate-600">
                                        Charger un dossier
                                    </span>
                                </div>
                            </div>
                        </div>

                        {data.length === 0 && (
                            <div className="bg-white p-12 rounded-2xl shadow-sm border border-slate-100 text-center flex flex-col items-center">
                                <IconFileSpreadsheet className="w-16 h-16 text-slate-300 mb-4" />
                                <h3 className="text-xl font-semibold text-slate-700">Aucune donnée chargée</h3>
                                <p className="text-slate-500 max-w-md mt-2">
                                    Cliquez sur "Charger un dossier" pour importer tout votre historique d'un coup, ou glissez vos fichiers Excel isolés.
                                </p>
                            </div>
                        )}

                        {data.length > 0 && (
                            <>
                                <div className="flex gap-4 items-center bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex-wrap data-html2canvas-ignore">
                                    <div className="flex items-center gap-2 text-slate-600 font-medium mr-4">
                                        <IconFilter className="w-5 h-5" />
                                        Filtres :
                                    </div>
                                    
                                    <div className="flex flex-col">
                                        <label className="text-xs text-slate-500 mb-1">Période (Semaine)</label>
                                        <select 
                                            className="bg-slate-50 border border-slate-200 text-slate-700 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                                            value={selectedPeriod}
                                            onChange={(e) => setSelectedPeriod(e.target.value)}
                                        >
                                            {periods.map(p => <option key={p} value={p}>{p}</option>)}
                                        </select>
                                    </div>

                                    <div className="flex flex-col">
                                        <label className="text-xs text-slate-500 mb-1">Équipe</label>
                                        <select 
                                            className="bg-slate-50 border border-slate-200 text-slate-700 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                                            value={selectedTeam}
                                            onChange={(e) => {
                                                setSelectedTeam(e.target.value);
                                                setSelectedUser('All');
                                            }}
                                        >
                                            {teams.map(t => <option key={t} value={t}>{t}</option>)}
                                        </select>
                                    </div>

                                    <div className="flex flex-col">
                                        <label className="text-xs text-slate-500 mb-1">Consultant</label>
                                        <select 
                                            className="bg-slate-50 border border-slate-200 text-slate-700 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                                            value={selectedUser}
                                            onChange={(e) => setSelectedUser(e.target.value)}
                                        >
                                            {consultants.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                                        <div className="p-4 bg-blue-100 text-blue-600 rounded-xl">
                                            <IconActivity className="w-8 h-8" />
                                        </div>
                                        <div>
                                            <p className="text-slate-500 text-sm font-medium">Total Actions</p>
                                            <p className="text-3xl font-bold text-slate-800">{stats.totalActions}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                                        <div className="p-4 bg-emerald-100 text-emerald-600 rounded-xl">
                                            <IconTarget className="w-8 h-8" />
                                        </div>
                                        <div>
                                            <p className="text-slate-500 text-sm font-medium">Cibles Uniques</p>
                                            <p className="text-3xl font-bold text-slate-800">{stats.uniqueTargets}</p>
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                                        <div className="p-4 bg-purple-100 text-purple-600 rounded-xl">
                                            <IconUsers className="w-8 h-8" />
                                        </div>
                                        <div>
                                            <p className="text-slate-500 text-sm font-medium">Consultants Actifs</p>
                                            <p className="text-3xl font-bold text-slate-800">{stats.activeConsultants}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                        <h3 className="text-lg font-semibold text-slate-800 mb-6">Performance par Consultant (Top 10)</h3>
                                        <div className="h-[400px] w-full">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <BarChart layout="vertical" data={barChartData} margin={{ top: 5, right: 30, left: 40, bottom: 5 }}>
                                                    <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke="#e2e8f0" />
                                                    <XAxis type="number" tick={{fill: '#64748b', fontSize: 12}} tickLine={false} axisLine={false} />
                                                    <YAxis type="category" dataKey="name" tick={{fill: '#64748b', fontSize: 12}} tickLine={false} axisLine={false} width={90} />
                                                    <RechartsTooltip contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} cursor={{fill: '#f1f5f9'}} />
                                                    <Legend wrapperStyle={{ fontSize: '12px', color: '#475569', paddingTop: '20px' }} />
                                                    <Bar dataKey="commercial" name="Activité Commerciale" fill="#6366f1" radius={[0, 4, 4, 0]} />
                                                    <Bar dataKey="recrutement" name="Activité Recrutement" fill="#10b981" radius={[0, 4, 4, 0]} />
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                        <h3 className="text-lg font-semibold text-slate-800 mb-6">Répartition des Actions</h3>
                                        <div className="h-[400px] w-full">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <PieChart>
                                                    <Pie data={pieChartData} cx="50%" cy="50%" innerRadius={100} outerRadius={140} paddingAngle={2} dataKey="value">
                                                        {pieChartData.map((entry, index) => (
                                                            <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                                        ))}
                                                    </Pie>
                                                    <RechartsTooltip contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} />
                                                    <Legend layout="vertical" verticalAlign="middle" align="right" wrapperStyle={{ fontSize: '12px', color: '#475569' }} />
                                                </PieChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                        <h3 className="text-lg font-semibold text-slate-800 flex items-center gap-2">
                                            <IconBriefcase className="w-5 h-5 text-slate-500" />
                                            Détail des activités
                                        </h3>
                                        <span className="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-sm font-medium">
                                            {filteredData.length} lignes
                                        </span>
                                    </div>
                                    <div className="overflow-x-auto max-h-[400px]">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-slate-700 font-medium sticky top-0 z-10 shadow-sm">
                                                <tr>
                                                    <th className="px-6 py-4 border-b border-slate-200">Action</th>
                                                    <th className="px-6 py-4 border-b border-slate-200">Semaine</th>
                                                    <th className="px-6 py-4 border-b border-slate-200">Équipe</th>
                                                    <th className="px-6 py-4 border-b border-slate-200">Consultant</th>
                                                    <th className="px-6 py-4 border-b border-slate-200">Cible</th>
                                                    <th className="px-6 py-4 border-b border-slate-200">Nom</th>
                                                    <th className="px-6 py-4 border-b border-slate-200">Qté</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {filteredData.slice(0, 100).map((row) => (
                                                    <tr key={row.id} className="hover:bg-slate-50 transition-colors">
                                                        <td className="px-6 py-3">{row.action}</td>
                                                        <td className="px-6 py-3 whitespace-nowrap">
                                                            <span className="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs font-medium">{row.period}</span>
                                                        </td>
                                                        <td className="px-6 py-3">{row.team}</td>
                                                        <td className="px-6 py-3">{row.consultant}</td>
                                                        <td className="px-6 py-3">
                                                            <span className={`px-2 py-1 rounded text-xs font-medium ${row.cible.toLowerCase() === 'client' ? 'bg-indigo-50 text-indigo-700' : 'bg-emerald-50 text-emerald-700'}`}>
                                                                {row.cible}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-3 font-medium text-slate-700">{row.targetName}</td>
                                                        <td className="px-6 py-3">{row.value}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    {filteredData.length > 100 && (
                                        <div className="p-4 text-center text-sm text-slate-500 bg-slate-50 border-t border-slate-100">
                                            Affichage des 100 premières lignes. Filtrez pour affiner.
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RecruitmentDashboard />);
    </script>
</body>
</html>
