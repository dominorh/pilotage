<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e0da; --grid:#ebe9e4;

    --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c84;

    --shadow:none;
  }
}

  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2f2c; --grid:#2a2a28;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c84;
  --accent:#8494dd; --accent-fill:#4b5fbf; --brand-orange:#f26a4b; --brand-gray:#8a8a8a; --day:#1f2c66; --day-strong:#2f4396; --day-text:#e6eafa;
  --warn:#f0a44b; --warn-bg:#3a2a12; --late:#f08080; --late-bg:#3d1f1f; --ok:#4cc999;

body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.sub{color:var(--text-2);font-size:13px}

nav.tabsnav a.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}

button,select,input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}

<script>
/* =================== utilitaires =================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf1 = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:2});
const hfmt = v => nf1.format(v) + ' h';
const clean = v => v == null ? '' : String(v).replace(/[\u0000-\u001f\u007f-\u009f�]/g,'').replace(/\s+/g,' ').trim();
const normH = s => clean(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const lsGet = (k,d) => { try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const HEBDO = 35;   // ETP hebdomadaire, comme la colonne « T In » du fichier (heures / 35)

function isoWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
  const y = d.getUTCFullYear();
  return {y, w: Math.ceil(((d - Date.UTC(y,0,1)) / 864e5 + 1) / 7)};
}
function weekMonday(y, w){ const j4 = new Date(y,0,4), day = j4.getDay() || 7; return new Date(y, 0, 4 - day + 1 + (w-1)*7); }
const weekKey = (y,w) => `${y}-S${String(w).padStart(2,'0')}`;
const parseWeekKey = k => { const m = /^(\d{4})-S(\d{2})$/.exec(k||''); return m ? {y:+m[1], w:+m[2]} : null; };
function weekDays(k){ const p = parseWeekKey(k); const mon = weekMonday(p.y, p.w); return [...Array(7)].map((_,i)=>new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i)); }
function weekLabel(k, long){
  const p = parseWeekKey(k); if (!p) return k;
  const d = weekDays(k), a = d[0], b = d[6];
  const range = `${a.getDate()}${a.getMonth()!==b.getMonth()?' '+MOIS[a.getMonth()]:''} – ${b.getDate()} ${MOIS[b.getMonth()]}`;
  return long ? `S${p.w} ${p.y} · ${range}` : `S${p.w}`;
}
const fdate = d => d ? d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '';
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
function toDate(v){
  if (v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Date.UTC(1899,11,30) + v*864e5); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  const m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/.exec(clean(v));
  if (m){ const y = m[3].length===2 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2]-1, +m[1]); }
  return null;
}
const toNum = v => { if (typeof v === 'number') return v; const s = clean(v).replace(',', '.'); return s && isFinite(+s) ? +s : null; };
const hasOne = v => /(^|[^0-9])1([^0-9]|$)/.test(clean(v).replace(/\.0+$/,''));

/* =================== lecture du planning Excel =================== */
// Un onglet de planning : une ligne d'en-tête avec « METIER » et « Candidat » et 7 colonnes de dates (lun → dim).
// En dessous : une ligne par client (colonne « Client » = 1 pour les clients comptés), puis ses intérimaires.
function parsePlanning(buf, fileName){
  const wb = XLSX.read(buf, {type:'array'});   // dates lues en numéro de série Excel : pas de décalage de fuseau horaire
  const weeks = [], skipped = [], notes = [];
  for (const sn of wb.SheetNames){
    const ws = wb.Sheets[sn];
    const rg = XLSX.utils.decode_range(ws['!ref'] || 'A1');          // décalage de la plage (ex. commence en B)
    const grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true, blankrows:true});
    const hi = grid.findIndex(r => r && r.some(c => normH(c)==='metier') && r.some(c => normH(c)==='candidat'));
    if (hi < 0){ skipped.push(sn); continue; }
    const H = grid[hi];
    const col = name => H.findIndex(c => normH(c) === name);
    const nameCol = H.findIndex(c => clean(c) !== '');
    const agence = clean(H[nameCol]) || fileName.replace(/\.[^.]+$/,'');
    const cMet = col('metier'), cCtr = H.findIndex(c => normH(c).startsWith('contrat')), cVm = col('vm'), cCom = H.findIndex(c => normH(c).startsWith('commentaire'));
    const cCli = col('client'), cCand = col('candidat');
    const dayCols = []; H.forEach((c,i) => { if (toDate(c) && dayCols.length < 7) dayCols.push(i); });
    if (dayCols.length < 5){ skipped.push(sn); continue; }
    const cTot = H.findIndex((c,i) => i > dayCols[dayCols.length-1] && /^the/.test(normH(c)));
    const cEtp = H.findIndex((c,i) => i > cTot && cTot >= 0 && /^t(in|etp)/.test(normH(c)));
    const abs = c => c >= 0 ? rg.s.c + c : -1;                         // colonne absolue (0 = A)
    const between = []; for (let i = cCand+1; i < dayCols[0]; i++) between.push(i);   // colonnes début / fin de contrat
    const cDeb = between[0] ?? -1, cFin = between[1] ?? -1;
    // semaine : nom de l'onglet (S43) en priorité, sinon dates d'en-tête
    const hdrDate = toDate(H[dayCols[0]]);
    let wk, wkFromName = /^\s*s(?:em(?:aine)?)?\s*(\d{1,2})\s*$/i.exec(sn);
    if (wkFromName){
      const w = +wkFromName[1]; let y = hdrDate ? isoWeek(hdrDate).y : new Date().getFullYear();
      wk = weekKey(y, w);
      if (hdrDate){ const hw = isoWeek(hdrDate); if (hw.w !== w) notes.push(`Onglet « ${sn} » : les dates d'en-tête (${fdate(hdrDate)}…) sont celles de la S${hw.w} ; c'est le nom de l'onglet qui est retenu.`); }
    } else if (hdrDate){ const r = isoWeek(hdrDate); wk = weekKey(r.y, r.w); }
    else { skipped.push(sn); continue; }
    const rows = [];
    let client = null;
    for (let r = hi+1; r < grid.length; r++){
      const R = grid[r] || [];
      const name = clean(R[nameCol]);
      if (/^totaux?\b/i.test(name)) break;
      if (!name) continue;
      const days = dayCols.map(c => toNum(R[c]));
      const hasDays = days.some(v => v != null);
      const cand = cCand >= 0 ? clean(R[cCand]) : '';
      const met = cMet >= 0 ? clean(R[cMet]) : '';
      if (!cand && !hasDays && !met){        // ligne client
        client = {name, inclus: cCli >= 0 && hasOne(R[cCli])};
        rows.push({type:'client', client:name, inclus:client.inclus});
        continue;
      }
      const total = days.reduce((s,v) => s + (v||0), 0);
      const fileTot = cTot >= 0 ? toNum(R[cTot]) : null;
      rows.push({type:'int', client: client ? client.name : '(sans client)', inclus: client ? client.inclus : false,
        nom: name, metier: met, contrat: cCtr>=0 ? clean(R[cCtr]) : '', vm: cVm>=0 ? clean(R[cVm]) : '', commentaire: cCom>=0 ? clean(R[cCom]) : '',
        candidat: toNum(R[cCand]), debut: cDeb>=0 ? toDate(R[cDeb]) : null, fin: cFin>=0 ? toDate(R[cFin]) : null,
        days, total, fileTot,
        ref: {sheet: sn, row: rg.s.r + r + 1, cols: {nom: abs(nameCol), metier: abs(cMet), contrat: abs(cCtr), vm: abs(cVm), commentaire: abs(cCom),
          debut: abs(cDeb), fin: abs(cFin), days: dayCols.map(abs), tot: abs(cTot), etp: abs(cEtp)}}});
    }
    weeks.push({sheet: sn, week: wk, agence, rows});
  }
  return {weeks, skipped, notes};
}

/* =================== état =================== */
let datasets = [];            // {name, mtime, weeks, skipped, notes, error}
let F = {week:'', agence:'', client:'', metier:'', q:''};
let showExcl = false;

// toutes les semaines connues (une semaine + agence présente dans plusieurs fichiers : le fichier le plus récent l'emporte)
function allWeeks(){
  const best = new Map();
  for (const d of [...datasets].sort((a,b)=>(a.mtime||0)-(b.mtime||0)))
    for (const w of (d.weeks||[])) best.set(w.agence+'|'+w.week, {...w, fichier:d.name});
  return [...best.values()];
}
function weekRows(week, agence){
  const out = [];
  for (const w of allWeeks()) if (w.week === week && (!agence || w.agence === agence)) for (const r of w.rows) out.push({...r, agence:w.agence, week:w.week, fichier:w.fichier});
  return out;
}
const uniqSorted = (arr) => [...new Set(arr)].filter(Boolean).sort((a,b)=>a.localeCompare(b,'fr'));

/* =================== rendu =================== */
function fillSelect(sel, values, cur, all, labelFn){
  sel.innerHTML = (all!=null?`<option value="">${all}</option>`:'') + values.map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(labelFn?labelFn(v):v)}</option>`).join('');
}
function currentWeekKey(){ const r = isoWeek(new Date()); return weekKey(r.y, r.w); }

function render(){
  const W = allWeeks();
  const weeks = uniqSorted(W.map(w=>w.week)).reverse();
  const agences = uniqSorted(W.map(w=>w.agence));
  if (!weeks.includes(F.week)) F.week = weeks.includes(currentWeekKey()) ? currentWeekKey() : (weeks[0] || '');
  fillSelect($('fWeek'), weeks, F.week, null, k=>weekLabel(k,true));
  $('agWrap').style.display = agences.length > 1 ? '' : 'none';
  if (!agences.includes(F.agence)) F.agence = '';
  fillSelect($('fAgence'), agences, F.agence, 'Toutes');
  const wr = F.week ? weekRows(F.week, F.agence) : [];
  const ints = wr.filter(r => r.type==='int' && (showExcl || r.inclus));
  fillSelect($('fClient'), uniqSorted(ints.map(r=>r.client)), F.client, 'Tous');
  fillSelect($('fMetier'), uniqSorted(ints.map(r=>r.metier)), F.metier, 'Tous');
  $('prevW').disabled = !F.week || weeks.indexOf(F.week) >= weeks.length-1;
  $('nextW').disabled = !F.week || weeks.indexOf(F.week) <= 0;

  // fichiers
  $('files').innerHTML = datasets.length ? datasets.map(d=>{
    const ws = (d.weeks||[]).map(w=>weekLabel(w.week)).join(', ');
    return `<span class="chip ${d.error?'err':''}" title="${esc(d.error || ((d.skipped||[]).length ? 'Onglets ignorés (pas au format planning hebdo) : '+d.skipped.join(', ') : ''))}">${esc(d.name)} <span class="muted">(${d.error ? '⚠ '+esc(d.error) : ws || 'aucune semaine'})</span></span>`;
  }).join('') : `<span class="muted">${(dirHandle||snapshotFiles)?'Aucun planning Excel dans ce dossier pour l\'instant.':'Aucun fichier. Choisis le dossier des plannings ou ajoute un fichier Excel.'}</span>`;
  $('subtitle').textContent = W.length ? `${agences.join(', ')} · ${weeks.length} semaine(s) : ${weeks.slice().reverse().map(k=>weekLabel(k)).join(', ')}` : 'Import des plannings hebdomadaires Excel';
  $('title').textContent = 'Planning des intérimaires' + (F.agence ? ' — ' + F.agence : agences.length === 1 ? ' — ' + agences[0] : '');
  $('printScope').textContent = `${F.week ? weekLabel(F.week,true) : ''}${F.client?' · '+F.client:''}${F.metier?' · '+F.metier:''} · édité le ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}`;

  if (!F.week){ $('main').innerHTML = '<div class="card empty">Ajoute un planning Excel (onglets hebdomadaires S42, S43…) pour afficher le planning.</div>'; return; }
  renderMain(wr);
}

function rowVisible(r){
  if (r.type !== 'int') return false;
  if (!showExcl && !r.inclus) return false;
  if (F.client && r.client !== F.client) return false;
  if (F.metier && r.metier !== F.metier) return false;
  if (F.q){ const s = [r.nom, r.metier, r.client, r.commentaire, r.contrat, r.vm].join(' ').toLowerCase(); if (!s.includes(F.q)) return false; }
  return true;
}
function finStatus(r, days){
  if (!r.fin) return null;
  if (r.fin < days[0]) return {cls:'late', txt:'fin dépassée'};
  if (r.fin <= days[6]) return {cls:'warn', txt:'fin cette semaine'};
  return null;
}

function renderMain(wr){
  editIndex.clear();

    <div class="card kpi ${late.length?'late':''}"><div class="v">${late.length}</div><div class="l">Fins de contrat dépassées</div><div class="s">fin avant le ${fdate(days[0])} : à renouveler ?</div></div>

  const maxD = Math.max(1, ...dayTot);
  h += `<section class="card sec" id="daySec"><div class="sec-h"><div><h2>Heures planifiées par jour</h2><div class="sub">${weekLabel(F.week,true)}</div></div></div>
    <div class="daysum">${days.map((d,i)=>`<div class="ds ${i>=5?'we':''}"><div class="v">${dayTot[i]?nf1.format(dayTot[i])+' h':'—'}</div><div class="bar" style="height:${dayTot[i]/maxD*78}%"></div><div class="l" ${sameDay(d,today)?'style="color:var(--accent);font-weight:650"':''}>${JOURS[i]} ${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')}</div></div>`).join('')}</div></section>`;

  // planning par client
  h += `<div class="sec-h"><div><h2>Intérimaires par client</h2><div class="sub">${clients.length} client(s) · ${vis.length} intérimaire(s) · ${hfmt(tot)}</div></div></div>`;
  if (!clients.length) h += `<div class="card empty">Aucun intérimaire ne correspond aux filtres.</div>`;
  const colg = editMode
    ? `<colgroup><col style="width:13%"><col style="width:11%"><col style="width:5%"><col style="width:11%"><col style="width:9.6%"><col style="width:9.6%">${days.map(()=>'<col style="width:4.4%">').join('')}<col style="width:5%"><col style="width:4.4%"></colgroup>`
    : `<colgroup><col style="width:15%"><col style="width:12%"><col style="width:5%"><col style="width:11%"><col style="width:7%"><col style="width:10%">${days.map(()=>'<col style="width:4.4%">').join('')}<col style="width:6%"><col style="width:5%"></colgroup>`;
  const head = `<thead><tr><th>Intérimaire</th><th>Métier</th><th>Contrat</th><th>VM / commentaire</th><th>Début</th><th>Fin</th>${days.map((d,i)=>`<th class="d" ${sameDay(d,today)?'style="color:var(--accent)"':''}>${JOURS[i]}<br><span class="muted" style="font-weight:400">${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')}</span></th>`).join('')}<th class="n">Total</th><th class="n">ETP</th></tr></thead>`;
  for (const c of clients){
    const rs = byClient.get(c.name);
    const ct = rs.reduce((s,r)=>s+r.total,0);
    const cAlerts = rs.filter(r=>finStatus(r,days)).length;
    h += `<section class="card client ${c.inclus?'':'excl'}">
      <div class="client-h"><div class="name">${esc(c.name)} ${c.inclus?'':'<span class="badge mute">exclu (sans 1)</span>'}${F.agence||$('agWrap').style.display==='none'?'':` <span class="badge mute">${esc(c.agence)}</span>`}</div>
        <div class="stats"><span><b>${rs.length}</b> intérimaire(s)</span><span><b>${nf1.format(ct)}</b> h</span><span><b>${nf2.format(ct/HEBDO)}</b> ETP</span>${cAlerts?`<span class="badge warn">${cAlerts} contrat(s) à surveiller</span>`:''}</div></div>
      <table class="pl">${colg}${head}<tbody>${rs.map(r=>{
        const fs = finStatus(r, days);
        const vmc = [r.vm, r.commentaire].filter(Boolean).join(' · ');
        const ed = editMode && canEdit(r);
        const fk = f => `${r.fichier}|${r.ref.sheet}|${r.ref.row}|${f}`;
        const inp = (f, val, cls, ph) => `<input class="ed ${cls||''} ${fk(f)===lastSavedFk?'saved':''}" data-fk="${esc(fk(f))}" data-f="${f}" value="${esc(val)}" ${ph?`placeholder="${esc(ph)}"`:''} ${cls==='num'?'inputmode="decimal"':''} autocomplete="off">`;
        const dinp = (f, d) => `<input type="date" class="ed date ${fk(f)===lastSavedFk?'saved':''}" data-fk="${esc(fk(f))}" data-f="${f}" value="${d?isoDate(d):''}">`;
        if (ed) editIndex.set(`${r.fichier}|${r.ref.sheet}|${r.ref.row}`, r);
        const cells = r.days.map((v,i)=> ed ? `<td class="d">${inp('d'+i, v==null?'':String(v).replace('.',','), 'num')}</td>`
          : `<td class="d">${v==null?'<span class="hc off">·</span>':v===0?'<span class="hc off">0</span>':`<span class="hc ${v>=9?'big':'on'}">${nf1.format(v)}</span>`}</td>`).join('');
        const mobileDays = `<td class="days">${r.days.map((v,i)=>v?`<span class="hc ${v>=9?'big':'on'}" title="${JOURS[i]}">${JOURS[i][0]} ${nf1.format(v)}</span>`:'').join('') || '<span class="muted">aucune heure</span>'}</td>`;
        const diff = r.fileTot != null && Math.abs(r.fileTot - r.total) > 0.01 ? `<div class="fileWarn">fichier : ${nf1.format(r.fileTot)} h</div>` : '';
        if (ed) return `<tr class="editing"><td data-l="Intérimaire"><span class="nm">${esc(r.nom)}</span></td><td data-l="Métier">${inp('metier', r.metier, '', 'Métier')}</td><td data-l="Contrat">${inp('contrat', r.contrat)}</td>
          <td data-l="VM / commentaire">${r.ref.cols.vm>=0?inp('vm', r.vm, '', 'VM'):''}${r.ref.cols.commentaire>=0?inp('commentaire', r.commentaire, 'mt', 'Commentaire'):''}</td>
          <td data-l="Début">${r.ref.cols.debut>=0?dinp('debut', r.debut):''}</td><td data-l="Fin">${r.ref.cols.fin>=0?dinp('fin', r.fin):''}${fs?`<br><span class="badge ${fs.cls}">${fs.txt}</span>`:''}</td>
          ${cells}${mobileDays}<td class="n" data-l="Total"><b>${nf1.format(r.total)}</b></td><td class="n" data-l="ETP">${nf2.format(r.total/HEBDO)}</td></tr>`;
        return `<tr><td data-l="Intérimaire"><span class="nm">${esc(r.nom)}</span></td><td data-l="Métier" class="small">${esc(r.metier)}</td><td data-l="Contrat" class="small">${esc(r.contrat)}</td>
          <td data-l="VM / commentaire" class="small">${esc(vmc)}</td><td data-l="Début" class="small">${fdate(r.debut)}</td>
          <td data-l="Fin" class="small">${fdate(r.fin)}${fs?`<br><span class="badge ${fs.cls}">${fs.txt}</span>`:''}</td>
          ${cells}${mobileDays}<td class="n" data-l="Total"><b>${nf1.format(r.total)}</b>${diff}</td><td class="n" data-l="ETP">${nf2.format(r.total/HEBDO)}</td></tr>`;
      }).join('')}</tbody></table></section>`;
  }

  // évolution par semaine
  const W = allWeeks().filter(w => !F.agence || w.agence === F.agence);
  const wks = uniqSorted(W.map(w=>w.week));
  if (wks.length > 1){
    const per = new Map();   // client -> week -> heures
    const nbInt = {};
    for (const w of W) for (const r of w.rows){
      if (r.type!=='int' || (!showExcl && !r.inclus) || (F.client && r.client!==F.client) || (F.metier && r.metier!==F.metier)) continue;
      if (!per.has(r.client)) per.set(r.client, {});
      per.get(r.client)[w.week] = (per.get(r.client)[w.week]||0) + r.total;
      nbInt[w.week] = (nbInt[w.week]||0) + 1;
    }
    const names = [...per.keys()].sort((a,b)=>a.localeCompare(b,'fr'));
    const colW = Math.max(7, Math.min(12, 60/wks.length));
    h += `<section class="card sec" id="evoSec" style="margin-top:16px"><div class="sec-h"><div><h2>Évolution des heures par semaine</h2><div class="sub">Heures planifiées par client (clients avec 1${showExcl?' et exclus':''})</div></div></div>
      <table class="evo"><colgroup><col style="width:${100-colW*wks.length}%">${wks.map(()=>`<col style="width:${colW}%">`).join('')}</colgroup>
      <thead><tr><th>Client</th>${wks.map(k=>`<th class="${k===F.week?'cur':''}">${weekLabel(k)}</th>`).join('')}</tr></thead>
      <tbody>${names.map(n=>`<tr><td>${esc(n)}</td>${wks.map(k=>{ const v = per.get(n)[k]; return `<td class="${k===F.week?'cur':''}">${v==null?'<span class="muted">—</span>':nf1.format(v)}</td>`; }).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr><td>Total heures</td>${wks.map(k=>`<td class="${k===F.week?'cur':''}">${nf1.format(names.reduce((s,n)=>s+(per.get(n)[k]||0),0))}</td>`).join('')}</tr>
        <tr><td>ETP</td>${wks.map(k=>`<td class="${k===F.week?'cur':''}">${nf2.format(names.reduce((s,n)=>s+(per.get(n)[k]||0),0)/HEBDO)}</td>`).join('')}</tr>
        <tr><td>Intérimaires</td>${wks.map(k=>`<td class="${k===F.week?'cur':''}">${nbInt[k]||0}</td>`).join('')}</tr></tfoot></table></section>`;
  }
  // garder le focus et la sélection sur la cellule en cours de saisie
  const ae = document.activeElement, keepFk = ae && ae.dataset && ae.dataset.fk;
  const selS = keepFk && ae.type !== 'date' ? ae.selectionStart : null, selE = keepFk && ae.type !== 'date' ? ae.selectionEnd : null;
  $('main').innerHTML = h;
  if (keepFk){ const el = document.querySelector(`[data-fk="${CSS.escape(keepFk)}"]`); if (el){ el.focus({preventScroll:true}); if (selS != null) try{ el.setSelectionRange(selS, selE); }catch(e){} } }
}

/* =================== surveillance du dossier =================== */
const FS_OK = 'showDirectoryPicker' in window;
const EXT = /\.(xlsx|xlsm|xls)$/i;
const cache = new Map(), manual = new Map();
let dirHandle = null, snapshotFiles = null, syncing = false, lastSig = '', lastChange = '';
function idb(){ return new Promise((ok,ko)=>{ const r = indexedDB.open('stats-commerciales',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
async function kvSet(k,v){ try{ const db = await idb(); await new Promise((ok,ko)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=ok; t.onerror=()=>ko(t.error); }); }catch(e){} }
async function kvGet(k){ try{ const db = await idb(); return await new Promise((ok,ko)=>{ const r=db.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }catch(e){ return null; } }
async function listFolder(dir, prefix='', out=[]){
  for await (const [name, h] of dir.entries()){
    if (name.startsWith('~$') || name.startsWith('.')) continue;
    if (h.kind === 'directory'){ if (!name.startsWith('_')) await listFolder(h, prefix+name+'/', out); continue; }
    else if (EXT.test(name)) out.push({name: prefix+name, handle: h});
  }
  return out;
}
async function currentEntries(){
  if (dirHandle){
    const out = [];
    for (const e of await listFolder(dirHandle)){
      try{ const f = await e.handle.getFile(); out.push({name:e.name, mtime:f.lastModified, size:f.size, file:f}); }
      catch(err){ out.push({name:e.name, mtime:0, size:-1, file:null}); }
    }
    return out;
  }
  if (snapshotFiles) return snapshotFiles.filter(f=>EXT.test(f.name) && !f.name.startsWith('~$')).map(f=>({name:f.webkitRelativePath.split('/').slice(1).join('/')||f.name, mtime:f.lastModified, size:f.size, file:f}));
  return [];
}
async function sync(){
  if (syncing) return; syncing = true;
  try{
    const entries = await currentEntries();
    for (const [n,f] of manual) entries.push({name:'(ajouté) '+n, mtime:f.lastModified, size:f.size, file:f});
    const sig = entries.map(f=>f.name+':'+f.mtime+':'+f.size).join('|');
    if (sig !== lastSig){
      const names = new Set(entries.map(f=>f.name)); let retry = false, changed = 0;
      for (const n of [...cache.keys()]) if (!names.has(n)){ cache.delete(n); changed++; }
      for (const f of entries){
        const fsig = f.mtime+':'+f.size, prev = cache.get(f.name);
        if (prev && prev.sig === fsig) continue;
        const wasRetry = prev && prev.sig === 'retry';
        try{
          if (!f.file) throw new Error('illisible');
          const res = parsePlanning(new Uint8Array(await f.file.arrayBuffer()), f.name.replace(/^\(ajouté\) /,''));
          cache.set(f.name, {sig:fsig, mtime:f.mtime, ...res, error: res.weeks.length ? '' : 'aucun onglet de planning hebdo reconnu'});
          changed++;
        }catch(e){ retry = true; cache.set(f.name, {sig:'retry', mtime:f.mtime, weeks: prev?prev.weeks:[], error:'illisible pour l\'instant (fichier ouvert dans Excel ?)'}); if (!wasRetry) changed++; }
      }
      if (!retry) lastSig = sig;
      datasets = [...cache].sort((a,b)=>a[0].localeCompare(b[0],'fr')).map(([name,c])=>({name, ...c}));
      if (changed){ lastChange = `dernier changement à ${new Date().toLocaleTimeString('fr-FR')}`; if (isTyping()) pendingRender = true; else render(); }
    }
    setLive(dirHandle ? 'ok' : snapshotFiles ? 'snap' : (manual.size ? 'manual' : 'none'));
  }catch(e){ setLive('lost'); }
  finally{ syncing = false; }
}
function setLive(state){
  const dot = $('liveDot'), txt = $('liveTxt');
  $('pickBtn').textContent = (dirHandle || snapshotFiles) ? 'Changer de dossier' : 'Choisir le dossier des plannings';
  $('refreshBtn').hidden = state !== 'snap';
  $('reconnectBtn').hidden = state !== 'reconnect';
  if (state==='ok'){ dot.className='dot ok'; txt.textContent = `Mise à jour automatique active · vérifié à ${new Date().toLocaleTimeString('fr-FR')}` + (lastChange?' · '+lastChange:''); }
  else if (state==='snap'){ dot.className='dot'; txt.textContent = 'Ce navigateur ne surveille pas les dossiers : clique sur « Actualiser » après une mise à jour (ou utilise Edge / Chrome).'; }
  else if (state==='reconnect'){ dot.className='dot'; txt.textContent = 'Clique sur « Reprendre la surveillance » pour réautoriser l\'accès au dossier.'; }
  else if (state==='lost'){ dot.className='dot ko'; txt.textContent = 'Le dossier n\'est plus accessible. Choisis-le à nouveau.'; dirHandle = null; }
  else if (state==='manual'){ dot.className='dot'; txt.textContent = 'Fichier ajouté à la main (non surveillé). Choisis le dossier pour suivre les mises à jour du planning automatiquement.'; }
  else { dot.className='dot'; txt.textContent = 'Choisis le dossier qui contient le planning Excel (onglets S42, S43…) : la page se mettra à jour à chaque enregistrement du fichier.'; }
}
async function pickFolder(){
  if (!FS_OK){ $('dirInput').click(); return; }
  try{
    const h = await window.showDirectoryPicker({id:'planning', mode:'read'});
    dirHandle = h; snapshotFiles = null; lastSig=''; cache.clear(); $('folder').textContent = h.name; kvSet('dir-planning', h); sync();
  }catch(e){ if (e.name !== 'AbortError'){ $('liveTxt').textContent = 'Accès au dossier refusé : ' + e.message; $('liveDot').className = 'dot ko'; } }
}
async function reconnect(){
  const h = await kvGet('dir-planning'); if (!h) return pickFolder();
  try{ if (await h.requestPermission({mode:'read'}) === 'granted'){ dirHandle = h; $('folder').textContent = h.name; lastSig=''; sync(); } }catch(e){ pickFolder(); }
}
async function restoreFolder(){
  if (!FS_OK){ setLive('none'); return; }
  const h = await kvGet('dir-planning'); if (!h){ setLive('none'); return; }
  $('folder').textContent = h.name;
  let perm = 'prompt'; try{ perm = await h.queryPermission({mode:'read'}); }catch(e){}
  if (perm === 'granted'){ dirHandle = h; sync(); } else setLive('reconnect');
}
function addFiles(files){ for (const f of files) manual.set(f.name, f); lastSig=''; sync(); }

/* =================== modification du planning (écriture dans le fichier Excel) =================== */
// Principe : on ne réécrit JAMAIS tout le classeur (on perdrait couleurs, formules, listes déroulantes…).
// À chaque changement : relecture du fichier le plus récent, contrôle que la ligne est toujours la même
// (nom de l'intérimaire), modification de la seule cellule concernée dans le XML de l'onglet,
// mise à jour des totaux de la ligne, et Excel recalcule le reste à l'ouverture.
let editMode = false, lastSavedFk = '', pendingRender = false;
const editIndex = new Map();                 // "fichier|onglet|ligne" -> ligne affichée
const undoStack = [];
const backedUp = new Set();
let saveChain = Promise.resolve();

const isoDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const canEdit = r => !!(dirHandle && r.fichier && !r.fichier.startsWith('(ajouté)') && r.ref);
const colLetter = c => { let s = ''; c++; while (c > 0){ const m = (c-1) % 26; s = String.fromCharCode(65+m) + s; c = Math.floor((c-1)/26); } return s; };
const colIndex = L => [...L].reduce((n,ch)=>n*26 + ch.charCodeAt(0)-64, 0) - 1;
const xmlEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const xmlUnesc = s => String(s).replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const dateToSerial = d => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899,11,30)) / 864e5);
const isTyping = () => { const a = document.activeElement; return !!(a && a.classList && a.classList.contains('ed') && a.value !== a.defaultValue); };
function editMsg(txt, kind){ const el = $('editMsg'); el.textContent = txt; el.className = 'msg' + (kind ? ' ' + kind : ''); }

async function fileHandleByPath(path){
  const parts = path.split('/'); let d = dirHandle;
  for (const p of parts.slice(0,-1)) d = await d.getDirectoryHandle(p);
  return d.getFileHandle(parts[parts.length-1]);
}
async function sheetXmlPath(zip, sheetName){
  const wb = await zip.file('xl/workbook.xml').async('string');
  let rid = null;
  for (const m of wb.matchAll(/<sheet\b[^>]*>/g)){
    const nm = /\bname="([^"]*)"/.exec(m[0]), id = /\br:id="([^"]*)"/.exec(m[0]);
    if (nm && id && xmlUnesc(nm[1]) === sheetName){ rid = id[1]; break; }
  }
  if (!rid) throw new Error(`onglet « ${sheetName} » introuvable`);
  const rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  for (const m of rels.matchAll(/<Relationship\b[^>]*>/g)){
    if (new RegExp(`\\bId="${rid}"`).test(m[0])){
      const tg = /\bTarget="([^"]*)"/.exec(m[0])[1];
      return tg.startsWith('/') ? tg.slice(1) : 'xl/' + tg.replace(/^\.\//,'');
    }
  }
  throw new Error('relation d\'onglet introuvable');
}
// construit l'élément <c> d'une cellule en conservant son style
function cellXml(ref, style, val){
  const s = style ? ` s="${style}"` : '';
  if (val.kind === 'empty') return `<c r="${ref}"${s}/>`;
  if (val.kind === 'num') return `<c r="${ref}"${s}><v>${val.v}</v></c>`;
  return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val.v)}</t></is></c>`;
}
// remplace (ou insère à sa place) une cellule dans le XML d'un onglet
function setCellInSheet(xml, ref, val, opts = {}){
  const rowNum = +/\d+$/.exec(ref)[0];
  const rowRe = new RegExp(`<row\\b[^>]*?\\br="${rowNum}"[^>]*?(?:/>|>[\\s\\S]*?</row>)`);
  const m = rowRe.exec(xml);
  if (!m) throw new Error(`ligne ${rowNum} introuvable dans le fichier`);
  let row = m[0];
  const cellRe = new RegExp(`<c\\b[^>]*?\\br="${ref}"[^>]*?(?:/>|>[\\s\\S]*?</c>)`);
  const cm = cellRe.exec(row);
  if (cm){
    const st = /\bs="(\d+)"/.exec(cm[0]);
    if (/<f[\s>/]/.test(cm[0]) && !opts.formulaCache) throw new Error(`la cellule ${ref} contient une formule : elle n'est pas modifiable ici`);
    if (opts.formulaCache){
      if (!/<f[\s>/]/.test(cm[0])) return xml;                              // valeur saisie à la main : on n'y touche pas
      let c = cm[0].replace(/^<c\b[^>]*>/, tag => tag.replace(/\st="[^"]*"/, ''));
      c = /<v>[^<]*<\/v>/.test(c) ? c.replace(/<v>[^<]*<\/v>/, `<v>${val.v}</v>`) : c.replace(/(<f\b[^>]*\/>|<\/f>)/, `$1<v>${val.v}</v>`);
      row = row.replace(cm[0], c);
    } else row = row.replace(cm[0], cellXml(ref, st && st[1], val));
  } else {
    if (opts.formulaCache) return xml;
    // cellule absente : on l'insère dans l'ordre des colonnes, avec le style de la cellule du dessus si possible
    const col = colIndex(/^[A-Z]+/.exec(ref)[0]);
    let style = null;
    for (let k = rowNum - 1; k >= Math.max(1, rowNum - 15) && style == null; k--){
      const up = new RegExp(`<c\\b[^>]*?\\br="${/^[A-Z]+/.exec(ref)[0]}${k}"[^>]*?\\bs="(\\d+)"`).exec(xml);
      if (up) style = up[1];
    }
    const nc = cellXml(ref, style, val);
    if (/\/>$/.test(row) && !/<\/row>$/.test(row)) row = row.replace(/\/>$/, `>${nc}</row>`);
    else {
      let placed = false;
      row = row.replace(/<c\b[^>]*?\br="([A-Z]+)\d+"/g, (all, L) => { if (!placed && colIndex(L) > col){ placed = true; return nc + all; } return all; });
      if (!placed) row = row.replace(/<\/row>$/, nc + '</row>');
    }
  }
  return xml.slice(0, m.index) + row + xml.slice(m.index + m[0].length);
}
const readCellVal = cell => {
  if (!cell || cell.v == null || cell.v === '') return {kind:'empty'};
  if (typeof cell.v === 'number') return {kind:'num', v: cell.v};
  return {kind:'text', v: String(cell.v)};
};

// convertit la saisie d'un champ en valeur de cellule
function parseInput(field, raw){
  raw = String(raw ?? '').trim();
  if (/^d\d$/.test(field)){
    if (raw === '') return {kind:'empty'};
    const n = +raw.replace(',', '.').replace(/\s*h$/i,'');
    if (!isFinite(n) || n < 0 || n > 24) throw new Error('heures attendues entre 0 et 24');
    return {kind:'num', v: Math.round(n*100)/100};
  }
  if (field === 'debut' || field === 'fin'){
    if (raw === '') return {kind:'empty'};
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw); if (!m) throw new Error('date invalide');
    return {kind:'num', v: dateToSerial(new Date(+m[1], +m[2]-1, +m[3]))};
  }
  return raw === '' ? {kind:'empty'} : {kind:'text', v: raw};
}
function currentVal(r, f){
  if (/^d\d$/.test(f)){ const v = r.days[+f.slice(1)]; return v == null ? {kind:'empty'} : {kind:'num', v}; }
  if (f === 'debut' || f === 'fin') return r[f] ? {kind:'num', v: dateToSerial(r[f])} : {kind:'empty'};
  return r[f] ? {kind:'text', v: r[f]} : {kind:'empty'};
}
const sameVal = (a, b) => a.kind === b.kind && (a.kind === 'empty' || String(a.v) === String(b.v));
const lastQueued = new Map();
const fieldCol = (cols, field) => /^d\d$/.test(field) ? cols.days[+field.slice(1)] : cols[field];

async function backupOnce(path, bytes){
  if (backedUp.has(path)) return;
  const dir = await dirHandle.getDirectoryHandle('_sauvegardes', {create:true});
  const now = new Date(), stamp = `${isoDate(now)} ${String(now.getHours()).padStart(2,'0')}h${String(now.getMinutes()).padStart(2,'0')}`;
  const base = path.split('/').pop().replace(/\.(xlsx|xlsm|xls)$/i, '');
  const fh = await dir.getFileHandle(`${base} - avant modification ${stamp}.xlsx`, {create:true});
  const w = await fh.createWritable(); await w.write(bytes); await w.close();
  backedUp.add(path);
}

// écrit une valeur dans le fichier ; renvoie l'ancienne valeur (pour « Annuler »)
async function writeCell(target, field, val){
  const {fichier, ref, nom} = target;
  const fh = await fileHandleByPath(fichier);
  let file;
  try { file = await fh.getFile(); } catch(e){ throw new Error('fichier illisible (ouvert dans Excel ?)'); }
  const bytes = new Uint8Array(await file.arrayBuffer());
  // 1. la ligne désigne-t-elle toujours le même intérimaire ?
  const wb = XLSX.read(bytes, {type:'array', sheets:[ref.sheet]});
  const ws = wb.Sheets[ref.sheet];
  if (!ws) throw new Error(`onglet « ${ref.sheet} » introuvable`);
  const at = c => ws[XLSX.utils.encode_cell({r: ref.row - 1, c})];
  if (clean(at(ref.cols.nom) && at(ref.cols.nom).v) !== nom) throw new Error('le planning a été modifié entre-temps (lignes déplacées) : la page vient d\'être rechargée, recommence la saisie');
  const col = fieldCol(ref.cols, field);
  if (col == null || col < 0) throw new Error('colonne introuvable');
  const old = readCellVal(at(col));
  // 2. modification ciblée du XML
  const zip = await JSZip.loadAsync(bytes, {createFolders:false});   // pas d'entrées « dossier » ajoutées à l'archive
  const path = await sheetXmlPath(zip, ref.sheet);
  let xml = await zip.file(path).async('string');
  xml = setCellInSheet(xml, colLetter(col) + ref.row, val);
  if (/^d\d$/.test(field)){                                    // totaux de la ligne (formules SUM et /35)
    const days = ref.cols.days.map((c,i) => 'd'+i === field ? (val.kind==='num' ? val.v : 0) : ((v => typeof v === 'number' ? v : 0)(at(c) && at(c).v)));
    const tot = Math.round(days.reduce((s,v)=>s+v,0)*100)/100;
    if (ref.cols.tot >= 0) xml = setCellInSheet(xml, colLetter(ref.cols.tot) + ref.row, {kind:'num', v: tot}, {formulaCache:true});
    if (ref.cols.etp >= 0) xml = setCellInSheet(xml, colLetter(ref.cols.etp) + ref.row, {kind:'num', v: tot/HEBDO}, {formulaCache:true});
  }
  zip.file(path, xml, {createFolders:false});
  // 3. Excel recalcule les totaux du classeur à l'ouverture
  let wbx = await zip.file('xl/workbook.xml').async('string');
  if (/<calcPr\b/.test(wbx)){ if (!/fullCalcOnLoad=/.test(wbx)) wbx = wbx.replace(/<calcPr\b/, '<calcPr fullCalcOnLoad="1"'); }
  else wbx = wbx.replace(/(<\/definedNames>|<\/sheets>)(?![\s\S]*<\/definedNames>)/, '$1<calcPr fullCalcOnLoad="1"/>');
  zip.file('xl/workbook.xml', wbx, {createFolders:false});
  const out = await zip.generateAsync({type:'uint8array', compression:'DEFLATE', compressionOptions:{level:6}});
  // 4. sauvegarde (une fois par session) puis écriture
  await backupOnce(fichier, bytes);
  try {
    const w = await fh.createWritable(); await w.write(out); await w.close();
  } catch(e){
    throw new Error(/NoModification|InvalidState|NotReadable|lock/i.test(e.name + e.message) ? 'fichier ouvert dans Excel ou verrouillé : ferme-le puis recommence' : 'écriture refusée : ' + e.message);
  }
  // 5. mettre à jour la page sans attendre la surveillance
  const nf = await fh.getFile();
  const res = parsePlanning(out, fichier);
  cache.set(fichier, {sig: nf.lastModified + ':' + nf.size, mtime: nf.lastModified, ...res, error: ''});
  datasets = [...cache].sort((a,b)=>a[0].localeCompare(b[0],'fr')).map(([name,c])=>({name, ...c}));
  return old;
}

const FIELD_LABEL = f => /^d\d$/.test(f) ? null : ({metier:'métier', contrat:'contrat', vm:'VM', commentaire:'commentaire', debut:'date de début', fin:'date de fin'})[f];
function describe(r, field, val){
  if (/^d\d$/.test(field)){ const d = weekDays(r.week)[+field.slice(1)]; return `${r.nom} · ${JOURS[+field.slice(1)]} ${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')} : ${val.kind==='empty' ? 'vide' : nf1.format(val.v) + ' h'}`; }
  const shown = val.kind === 'empty' ? 'vide' : (field==='debut'||field==='fin') ? fdate(toDate(val.v)) : `« ${val.v} »`;
  return `${r.nom} · ${FIELD_LABEL(field)} : ${shown}`;
}
function queueSave(r, field, val, isUndo){
  editMsg('Enregistrement…', 'busy');
  saveChain = saveChain.then(async () => {
    try {
      const old = await writeCell(r, field, val);
      if (!isUndo) undoStack.push({r, field, val: old});
      else lastQueued.set(`${r.fichier}|${r.ref.sheet}|${r.ref.row}|${field}`, val);
      $('undoBtn').hidden = !undoStack.length;
      lastSavedFk = `${r.fichier}|${r.ref.sheet}|${r.ref.row}|${field}`;
      editMsg(`${isUndo ? 'Annulé' : 'Enregistré'} dans ${r.fichier.split('/').pop()} à ${new Date().toLocaleTimeString('fr-FR')} — ${describe(r, field, val)}`, 'ok');
      if (isTyping()) pendingRender = true; else render();
    } catch(e){
      lastQueued.delete(`${r.fichier}|${r.ref.sheet}|${r.ref.row}|${field}`);
      editMsg('Non enregistré : ' + e.message, 'err');
      lastSig = ''; await sync(); render();
    }
  });
  return saveChain;
}

async function toggleEdit(){
  if (editMode){ editMode = false; $('editBtn').classList.remove('on'); $('editBtn').textContent = '✎ Modifier le planning'; editMsg(''); render(); return; }
  if (!FS_OK){ editMsg('La modification nécessite Edge ou Chrome.', 'err'); return; }
  if (!dirHandle){ editMsg('Choisis d\'abord le dossier du planning (« Choisir le dossier des plannings ») : un fichier ajouté à la main ne peut pas être modifié.', 'err'); return; }
  let perm = 'denied';
  try { perm = await dirHandle.requestPermission({mode:'readwrite'}); } catch(e){}
  if (perm !== 'granted'){ editMsg('Autorisation d\'écriture refusée par le navigateur.', 'err'); return; }
  editMode = true;
  $('editBtn').classList.add('on'); $('editBtn').textContent = '✓ Terminer les modifications';
  editMsg('Mode modification : chaque changement est enregistré directement dans le fichier Excel (sauvegarde dans « _sauvegardes » avant la 1re modification).', 'busy');
  render();
}

/* =================== événements =================== */
$('fWeek').onchange = e => { F.week = e.target.value; F.client=''; render(); };
$('fAgence').onchange = e => { F.agence = e.target.value; F.client=''; render(); };
$('fClient').onchange = e => { F.client = e.target.value; render(); };
$('fMetier').onchange = e => { F.metier = e.target.value; render(); };
$('search').addEventListener('input', e => { F.q = e.target.value.trim().toLowerCase(); render(); });
$('showExcl').checked = showExcl = lsGet('planning-excl', false);
$('showExcl').onchange = e => { showExcl = e.target.checked; lsSet('planning-excl', showExcl); render(); };
$('prevW').onclick = () => { const ws = [...$('fWeek').options].map(o=>o.value); const i = ws.indexOf(F.week); if (i < ws.length-1){ F.week = ws[i+1]; render(); } };
$('nextW').onclick = () => { const ws = [...$('fWeek').options].map(o=>o.value); const i = ws.indexOf(F.week); if (i > 0){ F.week = ws[i-1]; render(); } };
$('clearBtn').onclick = () => { F = {week:F.week, agence:'', client:'', metier:'', q:''}; $('search').value=''; render(); };
$('pickBtn').onclick = pickFolder; $('reconnectBtn').onclick = reconnect;
$('refreshBtn').onclick = () => $('dirInput').click();
$('addBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { addFiles([...e.target.files]); e.target.value=''; };
$('dirInput').onchange = e => { snapshotFiles = [...e.target.files]; dirHandle = null; lastSig=''; cache.clear(); $('folder').textContent = (snapshotFiles[0]?.webkitRelativePath||'').split('/')[0] || 'dossier'; e.target.value=''; sync(); };
$('pdfBtn').onclick = () => { const em = editMode; editMode = false; render(); setTimeout(() => { window.print(); editMode = em; render(); }, 50); };
$('themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur==='dark' ? 'light' : 'dark';
  try{ localStorage.setItem('stats-theme', document.documentElement.dataset.theme); }catch(e){}
};
try{ const t = localStorage.getItem('stats-theme'); if (t) document.documentElement.dataset.theme = t; }catch(e){}
$('editBtn').onclick = toggleEdit;
$('undoBtn').onclick = () => { const u = undoStack.pop(); $('undoBtn').hidden = !undoStack.length; if (u) queueSave(u.r, u.field, u.val, true); };
document.addEventListener('input', e => { const t = e.target; if (t.classList && t.classList.contains('ed')) t.classList.toggle('dirty', t.value !== t.defaultValue); });
document.addEventListener('change', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('ed')) return;
  const [fichier, sheet, row] = t.dataset.fk.split('|'), r = editIndex.get(`${fichier}|${sheet}|${row}`);
  if (!r) return;
  let val; try { val = parseInput(t.dataset.f, t.value); } catch(err){ editMsg(`${r.nom} : ${err.message}`, 'err'); t.focus(); return; }
  t.defaultValue = t.value; t.classList.remove('dirty');
  const key = t.dataset.fk, prevQ = lastQueued.get(key);
  if (prevQ ? sameVal(prevQ, val) : sameVal(currentVal(r, t.dataset.f), val)) return;   // rien n'a changé
  lastQueued.set(key, val);
  queueSave(r, t.dataset.f, val);
});
document.addEventListener('keydown', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('ed')) return;
  if (e.key === 'Enter'){                        // Entrée : valider et passer au champ suivant
    e.preventDefault();
    const all = [...document.querySelectorAll('input.ed')], i = all.indexOf(t);
    (all[i+1] || t).focus(); if (all[i+1] && all[i+1].select) all[i+1].select();
  } else if (e.key === 'Escape'){ t.value = t.defaultValue; t.classList.remove('dirty'); t.blur(); }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (pendingRender && !isTyping()){ pendingRender = false; render(); } }, 0); });
const drop = $('drop');
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev==='drop' || !e.relatedTarget) drop.classList.remove('over'); }));
document.addEventListener('drop', e => { const fs=[...e.dataTransfer.files].filter(f=>EXT.test(f.name)); if (fs.length) addFiles(fs); });

render();
restoreFolder();
setInterval(() => { if (dirHandle) sync(); }, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && dirHandle) sync(); });
</script>
