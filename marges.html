<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e0da; --grid:#ebe9e4;
  --text:#0b0b0b; --text-2:#52514e; --muted:#85837d;
  --accent:#2a78d6; --bar:#2a78d6; --cost:#c9c7bf; --marge:#1baf7a; --neg:#e34948;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2f2c; --grid:#2a2a28;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c84;
    --accent:#3987e5; --bar:#3987e5; --cost:#4a4945; --marge:#199e70; --neg:#e66767;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2f2c; --grid:#2a2a28;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c84;
  --accent:#3987e5; --bar:#3987e5; --cost:#4a4945; --marge:#199e70; --neg:#e66767;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 2px}
.sub{color:var(--text-2);font-size:13px}
.muted{color:var(--muted)}
nav.tabsnav{display:flex;gap:4px;margin-bottom:8px}
nav.tabsnav a{font-size:13px;color:var(--text-2);text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid var(--border)}
nav.tabsnav a.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{background:var(--surface-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--neg)}
button:disabled{opacity:.5;cursor:default}
select{min-width:120px;max-width:220px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--text-2)}
code{font:12px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.drop{border:1.5px dashed var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px}
.chip.err{border-color:var(--neg);color:var(--neg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:#1baf7a}.dot.ko{background:#e34948}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin:8px 0}
.filters .card{padding:10px 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .l{color:var(--text-2);font-size:12px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.sec{margin-bottom:16px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;overflow:hidden;max-width:100%}
.seg button{border:0;border-radius:0;padding:5px 10px;font-size:13px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--text);color:var(--surface)}
/* barres + chiffres */
.bt-head,.bt-row{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(120px,2.2fr) repeat(4,minmax(64px,.6fr));gap:10px;align-items:center}
.bt-head{font-size:12px;color:var(--text-2);font-weight:600;padding:0 6px 6px;border-bottom:1px solid var(--grid)}
.bt-head span.n,.bt-row .n{text-align:right;font-variant-numeric:tabular-nums}
.bt-head span.sort{cursor:pointer;user-select:none}
.bt-head span.sort:hover{color:var(--text)}
.bt-row{padding:6px;border-bottom:1px solid var(--grid);border-radius:6px}
.bt-row.click{cursor:pointer}
.bt-row.click:hover{background:var(--surface-2)}
.bt-row.sel{background:var(--surface-2)}
.bt-row.sel .lbl{color:var(--accent);font-weight:600}
.bt-row.tot{font-weight:650;border-bottom:0;border-top:1px solid var(--border)}

.fill span:first-child{border-radius:4px 0 0 4px}.fill span:last-child{border-radius:0 4px 4px 0}.fill span:only-child{border-radius:4px}

.more{text-align:center;margin-top:10px}

.split span:first-child{border-radius:4px 0 0 4px}.split span:last-child{border-radius:0 4px 4px 0}
.editor{border:1px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--surface)}
.editor .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 14px;margin:10px 0}
.editor label{display:flex;gap:6px;align-items:center;font-size:13px}
.editor input[type=checkbox]{width:16px;height:16px;padding:0}
.empty{color:var(--muted);padding:18px;text-align:center}

.msg:empty{display:none}

.msg.err{color:var(--neg);font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.45;z-index:50;max-width:320px;opacity:0;transition:opacity .08s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

  .bt-head{display:none}

<script>
/* =================== état & utilitaires =================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf0 = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur = v => nf0.format(Math.round(v)) + ' €';
const keur = v => Math.abs(v) >= 10000 ? nf1.format(v/1000) + ' k€' : eur(v);
const pctf = v => isFinite(v) ? nf1.format(v*100) + ' %' : '–';
const lsGet = (k,d) => { try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

let datasets = [];                 // {name, mtime, rows, error}
let F = {mois:'', groupe:'', com:'', dossier:'', client:'', gc:''};
let ETP_BASE = lsGet('marges-etp', 151.67);
let ATTRIB = lsGet('marges-attrib', 'contrat');
let groups = [];                            // [{id, name, members:[nom commercial]}] : enregistrées dans ce navigateur, par compte
try{ localStorage.removeItem('marges-agences'); }catch(e){}   // ancien enregistrement commun à tous les utilisateurs du poste, abandonné
let dim = lsGet('marges-dim', 'dossier');
let metric = lsGet('marges-metric', 'ca');
let sortKey = 'metric', sortDir = -1, showAll = false;
let editing = null;                // agence en cours d'édition

/* =================== lecture des CSV =================== */
const normH = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function decode(buf){
  let u = new Uint8Array(buf);
  if (u[0]===0xEF && u[1]===0xBB && u[2]===0xBF) u = u.subarray(3);
  try { return new TextDecoder('utf-8', {fatal:true}).decode(u); }
  catch(e){ return new TextDecoder('windows-1252').decode(u); }
}
function parseCsv(text){
  const sep = (text.split(/\r?\n/,1)[0].match(/;/g)||[]).length >= (text.split(/\r?\n/,1)[0].match(/,/g)||[]).length ? ';' : ',';
  const out = []; let row = [], cur = '', q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if (c==='"') q = true;
    else if (c===sep){ row.push(cur); cur=''; }
    else if (c==='\n'){ row.push(cur.replace(/\r$/,'')); out.push(row); row=[]; cur=''; }
    else cur += c;
  }
  if (cur || row.length){ row.push(cur.replace(/\r$/,'')); out.push(row); }
  return out.filter(r => r.some(x => x.trim()));
}
const num = s => { s = String(s??'').replace(/[\s  €%]/g,'').replace(',', '.'); const v = parseFloat(s); return isFinite(v) ? v : 0; };
const cleanName = s => String(s||'').replace(/\s+\d+\s*$/,'').replace(/\s+/g,' ').trim() || '(non renseigné)';
const clean = s => String(s||'').replace(/\s+/g,' ').trim();

const COLS = {
  dossier:['dossiertempo','dossier'], mois:['moisdepaie','mois'],
  codeComContrat:['codecommercialcontrat'], comContrat:['commercialcontrat'],
  codeClient:['codeduclient'], client:['nomduclient'], codeComClient:['codecommercialclient'], comClient:['commercialclient'],
  gc:['grandcompte'], matricule:['matriculedusalarie'], salarie:['nomdusalarie'], contrat:['ncontrat','numerocontrat'],
  qualif:['qualification'], hp:['hrspaye','heurespayees'], hf:['hrsfact','heuresfacturees'],
  paye:['totalpaye'], fact:['totalfacture'], marge:['marge'], coeff:['coeffcommercial'],
};
function parseMarges(buf, fileName){
  const rows = parseCsv(decode(buf));
  if (!rows.length) return {rows:[], error:'fichier vide'};
  const H = rows[0].map(normH);
  const idx = {};
  for (const [k, names] of Object.entries(COLS)) idx[k] = H.findIndex(h => names.includes(h));
  if (idx.dossier < 0 || idx.hf < 0 || idx.fact < 0) return {rows:[], error:'pas un export de marges', skip:true};
  const g = (r,k) => idx[k] >= 0 ? r[idx[k]] : '';
  const out = [];
  for (const r of rows.slice(1)){
    if (!clean(g(r,'dossier'))) continue;
    const fact = num(g(r,'fact')), paye = num(g(r,'paye'));
    out.push({
      fichier: fileName, raw: r.join(';'),
      dossier: clean(g(r,'dossier')), mois: clean(g(r,'mois')),
      comContrat: cleanName(g(r,'comContrat')), comClient: cleanName(g(r,'comClient')),
      client: clean(g(r,'client')) || '(non renseigné)', gc: clean(g(r,'gc')).replace(/^<\s*pas d.fini\s*>$/i,'') || '—',
      matricule: clean(g(r,'matricule')), salarie: clean(g(r,'salarie')), contrat: clean(g(r,'contrat')), qualif: clean(g(r,'qualif')),
      hp: num(g(r,'hp')), hf: num(g(r,'hf')), paye, fact,
      marge: idx.marge >= 0 ? num(g(r,'marge')) : fact - paye, coeff: num(g(r,'coeff')),
    });
  }
  return {rows: out, error: out.length ? '' : 'aucune ligne'};
}
const moisLabel = m => { const x = /^(\d{4})(\d{2})$/.exec(m||''); if (!x) return m||'';
  return new Date(+x[1], +x[2]-1, 1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase()); };

/* =================== agrégation =================== */
const comOf = r => ATTRIB === 'client' ? r.comClient : r.comContrat;
// une ligne identique présente dans plusieurs fichiers (export refait) n'est comptée qu'une fois
function allRows(){
  const best = new Map();
  for (const d of [...datasets].sort((a,b)=>(a.mtime||0)-(b.mtime||0))){
    const cnt = new Map();
    for (const r of d.rows){ const k = r.raw; cnt.set(k, (cnt.get(k)||0)+1); }
    for (const [k,c] of cnt){ const prev = best.get(k); if (!prev || c >= prev.c) best.set(k, {c, rows: d.rows.filter(r=>r.raw===k)}); }
  }
  return [...best.values()].flatMap(x => x.rows);
}
const groupById = id => groups.find(g => g.id === id);
function filtered(except){
  const gr = F.groupe ? groupById(F.groupe) : null;
  return allRows().filter(r =>
    (except==='mois'    || !F.mois    || r.mois === F.mois) &&
    (except==='groupe'  || !gr        || gr.members.includes(comOf(r))) &&
    (except==='com'     || !F.com     || comOf(r) === F.com) &&
    (except==='dossier' || !F.dossier || r.dossier === F.dossier) &&
    (except==='client'  || !F.client  || r.client === F.client) &&
    (except==='gc'      || !F.gc      || r.gc === F.gc));
}
function agg(rows){
  let hf=0, hp=0, ca=0, cout=0, marge=0, cw=0, ch=0;
  const mat = new Set(), cli = new Set(), ctr = new Set(), dos = new Set(), coms = new Set();
  for (const r of rows){
    hf+=r.hf; hp+=r.hp; ca+=r.fact; cout+=r.paye; marge+=r.marge;
    if (r.coeff > 0 && r.hf > 0){ cw += r.coeff*r.hf; ch += r.hf; }
    if (r.matricule && r.hf > 0) mat.add(r.matricule);
    if (r.fact > 0) cli.add(r.client);
    if (r.contrat) ctr.add(r.contrat);
    dos.add(r.dossier); coms.add(comOf(r));
  }
  const etp = hf / ETP_BASE;
  return {hf, hp, etp, ca, cout, marge, taux: ca ? marge/ca : NaN, coeff: ch ? cw/ch : NaN,
    margeH: hf ? marge/hf : NaN, caEtp: etp ? ca/etp : NaN, margeEtp: etp ? marge/etp : NaN,
    interims: mat.size, clients: cli.size, contrats: ctr.size, dossiers: dos.size, commerciaux: coms.size, lignes: rows.length};
}
const groupRows = (rows, keyFn) => { const m = new Map(); for (const r of rows){ const k = keyFn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); } return m; };
const uniqSorted = (rows, f) => [...new Set(rows.map(f))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'fr'));

const METRICS = {
  ca:    {label:'CA facturé',    get:a=>a.ca,    fmt:keur},
  marge: {label:'Marge',         get:a=>a.marge, fmt:keur},
  taux:  {label:'Taux de marge', get:a=>a.taux,  fmt:pctf},
  etp:   {label:'ETP',           get:a=>a.etp,   fmt:v=>nf1.format(v)},
  hf:    {label:'Heures fact.',  get:a=>a.hf,    fmt:v=>nf0.format(v)+' h'},
};
const DIMS = {
  dossier:{label:'Dossier', plural:'dossiers', key:r=>r.dossier},
  com:    {label:'Commercial', plural:'commerciaux', key:r=>comOf(r)},
  groupe: {label:'Agence', plural:'agences'},
  client: {label:'Client', plural:'clients', key:r=>r.client},
  qualif: {label:'Qualification', plural:'qualifications', key:r=>r.qualif||'(non renseignée)'},
};
// lignes de comparaison pour une dimension
function dimRows(rows, d){
  if (d === 'groupe') return groups.map(g => ({k:g.id, label:g.name, sub:g.members.join(', '), a:agg(rows.filter(r=>g.members.includes(comOf(r))))})).filter(x=>x.a.lignes);
  return [...groupRows(rows, DIMS[d].key)].map(([k,v]) => {
    let sub = '';
    if (d==='com') sub = uniqSorted(v, r=>r.dossier).join(', ');
    else if (d==='dossier') sub = uniqSorted(v, comOf).join(', ');
    else if (d==='client') sub = uniqSorted(v, r=>r.dossier).join(', ');
    return {k, label:k, sub, a:agg(v)};
  });
}

function fillSelect(sel, values, cur, all, labelFn){

function scopeText(){

function renderBars(rows){
  if (dim === 'groupe' && !groups.length) dim = 'dossier';
  $('dimSeg').innerHTML = Object.entries(DIMS).filter(([k])=>k!=='groupe'||groups.length).map(([k,d])=>`<button data-dim="${k}" class="${k===dim?'on':''}">${d.label}</button>`).join('');
  $('metricSeg').innerHTML = Object.entries(METRICS).map(([k,m])=>`<button data-metric="${k}" class="${k===metric?'on':''}">${m.label}</button>`).join('');
  const M = METRICS[metric];

    ? `<span><i style="background:var(--cost)"></i>Coût (total payé)</span><span><i style="background:var(--marge)"></i>Marge</span><span><i style="background:var(--neg)"></i>Marge négative</span>`

}
function sortList(list){
  const M = METRICS[metric];
  const val = x => sortKey==='metric' ? M.get(x.a) : sortKey==='label' ? x.label : x.a[sortKey];
  return list.sort((p,q)=>{ const a = val(p), b = val(q);
    const c = typeof a === 'string' ? a.localeCompare(b,'fr') : ((isFinite(a)?a:-Infinity) - (isFinite(b)?b:-Infinity));
    return c * sortDir || q.a.ca - p.a.ca; });
}
function barTable(list, rows, opt){
  if (!list.length) return '<div class="empty">Aucune donnée</div>';
  const M = METRICS[metric];
  const vals = list.map(x => M.get(x.a)).filter(isFinite);
  const max = Math.max(1e-9, ...vals.map(Math.abs), metric==='ca' ? 0 : 0);
  const shown = opt.limit ? list.slice(0, opt.limit) : list;
  const arrow = k => opt.click && sortKey===k ? (sortDir<0?' ↓':' ↑') : '';
  const sel = dim==='groupe' ? F.groupe : dim==='com' ? F.com : dim==='dossier' ? F.dossier : dim==='client' ? F.client : '';
  const head = `<div class="bt-head"><span class="${opt.click?'sort':''}" data-bsort="label">${DIMS[dim].label}${arrow('label')}</span><span class="${opt.click?'sort':''}" data-bsort="metric">${M.label}${arrow('metric')}</span>
    <span class="n ${opt.click?'sort':''}" data-bsort="etp">ETP${arrow('etp')}</span><span class="n ${opt.click?'sort':''}" data-bsort="ca">CA${arrow('ca')}</span>
    <span class="n ${opt.click?'sort':''}" data-bsort="marge">Marge${arrow('marge')}</span><span class="n ${opt.click?'sort':''}" data-bsort="taux">Taux${arrow('taux')}</span></div>`;
  const line = (x, isTot) => {
    const a = x.a, v = M.get(a);
    let bar;
    if (metric === 'ca'){
      const w = Math.max(a.ca,0)/max*100, m = a.marge, c = a.ca - Math.max(m,0);
      bar = `<div class="fill" style="width:${Math.min(100,w)}%">${c>0?`<span style="flex:${c};background:var(--cost)"></span>`:''}${m>0?`<span style="flex:${m};background:var(--marge)"></span>`:''}${m<0?`<span style="flex:${Math.max(-m, a.ca*0.02)};background:var(--neg)"></span>`:''}</div>`;
    } else {
      const w = isFinite(v) ? Math.abs(v)/max*100 : 0;
      bar = `<div class="fill" style="width:${Math.min(100,w)}%"><span style="flex:1;background:${v<0?'var(--neg)':'var(--bar)'}"></span></div>`;
    }
    if (isTot) bar = '';
    const tip = `<b>${esc(x.label)}</b><br>CA : ${eur(a.ca)}<br>Coût : ${eur(a.cout)}<br>Marge : ${eur(a.marge)} (${pctf(a.taux)})<br>ETP : ${nf2.format(a.etp)} (${nf0.format(a.hf)} h fact.)<br>Marge / ETP : ${isFinite(a.margeEtp)?eur(a.margeEtp):'–'}<br>Intérimaires : ${a.interims} · clients : ${a.clients}`;
    return `<div class="bt-row ${isTot?'tot':''} ${!isTot&&opt.click?'click':''} ${!isTot&&sel===x.k?'sel':''}" ${!isTot&&opt.click?`data-pick="${esc(x.k)}"`:''} ${isTot?'':`data-tip="${esc(tip)}"`}>
      <div class="lbl">${esc(x.label)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</div>
      <div class="track">${bar}</div>
      <div class="n" data-l="ETP">${nf1.format(a.etp)}</div><div class="n" data-l="CA">${keur(a.ca)}</div>
      <div class="n ${a.marge<0?'neg':''}" data-l="Marge">${keur(a.marge)}</div><div class="n ${a.taux<0?'neg':''}" data-l="Taux">${pctf(a.taux)}</div></div>`;
  };
  const tot = {label:'Total', a: dim==='groupe' ? agg(rows.filter(r=>groups.some(g=>g.members.includes(comOf(r))))) : agg(rows)};
  let more = '';
  if (opt.limit && list.length > opt.limit) more = `<div class="more"><button data-bmore="1">Afficher les ${list.length - opt.limit} autres</button></div>`;
  else if (opt.click && !opt.limit && list.length > 15) more = `<div class="more"><button data-bmore="0">Réduire</button></div>`;
  return head + shown.map(x=>line(x,false)).join('') + line(tot,true) + more;
}

/* =================== surveillance du dossier =================== */
const FS_OK = 'showDirectoryPicker' in window;
const EXT = /\.csv$/i;
const cache = new Map(), manual = new Map();
let dirHandle = null, snapshotFiles = null, syncing = false, lastSig = '', lastChange = '';
function idb(){ return new Promise((ok,ko)=>{ const r = indexedDB.open('stats-commerciales',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
async function kvSet(k,v){ try{ const db = await idb(); await new Promise((ok,ko)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=ok; t.onerror=()=>ko(t.error); }); }catch(e){} }
async function kvGet(k){ try{ const db = await idb(); return await new Promise((ok,ko)=>{ const r=db.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }catch(e){ return null; } }
async function listFolder(dir, prefix='', out=[]){
  for await (const [name, h] of dir.entries()){
    if (name.startsWith('~$') || name.startsWith('.')) continue;
    if (h.kind === 'directory'){ if (!name.startsWith('_')) await listFolder(h, prefix+name+'/', out); continue; }   // _corbeille, _sauvegardes : ignorés
    else if (EXT.test(name)) out.push({name: prefix+name, handle: h});
  }
  return out;
}
async function currentEntries(){
  if (dirHandle){
    const out = [];
    for (const e of await listFolder(dirHandle)){
      try{ const f = await e.handle.getFile(); out.push({name:e.name, mtime:f.lastModified, size:f.size, file:f}); }
      catch(err){ out.push({name:e.name, mtime:0, size:-1, file:null}); }
    }
    return out;
  }
  if (snapshotFiles) return snapshotFiles.filter(f=>EXT.test(f.name)).map(f=>({name:f.webkitRelativePath.split('/').slice(1).join('/')||f.name, mtime:f.lastModified, size:f.size, file:f}));
  return [];
}
async function sync(){
  if (syncing) return; syncing = true;
  try{
    const entries = await currentEntries();
    for (const [n,f] of manual) entries.push({name:'(ajouté) '+n, mtime:f.lastModified, size:f.size, file:f});
    const sig = entries.map(f=>f.name+':'+f.mtime+':'+f.size).join('|');
    if (sig !== lastSig){
      const names = new Set(entries.map(f=>f.name)); let retry = false, changed = 0;
      for (const n of [...cache.keys()]) if (!names.has(n)){ cache.delete(n); changed++; }
      for (const f of entries){
        const fsig = f.mtime+':'+f.size, prev = cache.get(f.name);
        if (prev && prev.sig === fsig) continue;
        const wasRetry = prev && prev.sig === 'retry';
        try{
          if (!f.file) throw new Error('illisible');
          const res = parseMarges(await f.file.arrayBuffer(), f.name.replace(/^\(ajouté\) /,''));
          cache.set(f.name, {sig:fsig, mtime:f.mtime, rows:res.rows, error:res.error, skip:res.skip});
          changed++;
        }catch(e){ retry = true; cache.set(f.name, {sig:'retry', mtime:f.mtime, rows: prev?prev.rows:[], error:'illisible pour l\'instant (fichier ouvert dans Excel ?)'}); if (!wasRetry) changed++; }
      }
      if (!retry) lastSig = sig;
      datasets = [...cache].sort((a,b)=>a[0].localeCompare(b[0],'fr')).map(([name,c])=>({name, ...c}));
      if (changed){
        lastChange = `dernier changement à ${new Date().toLocaleTimeString('fr-FR')}`;
        render(); if (editing) renderEditor();
      }
    }
    setLive(dirHandle ? 'ok' : snapshotFiles ? 'snap' : (manual.size ? 'manual' : 'none'));
  }catch(e){ setLive('lost'); }
  finally{ syncing = false; }
}
function setLive(state){
  const dot = $('liveDot'), txt = $('liveTxt');
  $('pickBtn').textContent = (dirHandle || snapshotFiles) ? 'Changer de dossier' : 'Choisir le dossier des exports';
  $('refreshBtn').hidden = state !== 'snap';
  $('reconnectBtn').hidden = state !== 'reconnect';
  if (state==='ok'){ dot.className='dot ok'; txt.textContent = `Mise à jour automatique active · vérifié à ${new Date().toLocaleTimeString('fr-FR')}` + (lastChange?' · '+lastChange:''); }
  else if (state==='snap'){ dot.className='dot'; txt.textContent = 'Ce navigateur ne surveille pas les dossiers : clique sur « Actualiser » après un nouvel export (ou utilise Edge / Chrome).'; }
  else if (state==='reconnect'){ dot.className='dot'; txt.textContent = 'Clique sur « Reprendre la surveillance » pour réautoriser l\'accès au dossier.'; }
  else if (state==='lost'){ dot.className='dot ko'; txt.textContent = 'Le dossier n\'est plus accessible. Choisis-le à nouveau.'; dirHandle = null; }
  else if (state==='manual'){ dot.className='dot'; txt.textContent = 'Fichiers ajoutés à la main (non surveillés). Choisis un dossier pour la mise à jour automatique.'; }
  else { dot.className='dot'; txt.textContent = 'Choisis le dossier où tu enregistres les exports de marges (.csv) : la page le surveillera et se mettra à jour toute seule.'; }
}
async function pickFolder(){
  if (!FS_OK){ $('dirInput').click(); return; }
  try{
    const h = await window.showDirectoryPicker({id:'marges', mode:'read'});
    dirHandle = h; snapshotFiles = null; lastSig=''; cache.clear(); $('folder').textContent = h.name; kvSet('dir-marges', h); sync();
  }catch(e){ if (e.name !== 'AbortError'){ $('liveTxt').textContent = 'Accès au dossier refusé : ' + e.message; $('liveDot').className = 'dot ko'; } }
}
async function reconnect(){
  const h = await kvGet('dir-marges'); if (!h) return pickFolder();
  try{ if (await h.requestPermission({mode:'read'}) === 'granted'){ dirHandle = h; $('folder').textContent = h.name; lastSig=''; sync(); } }catch(e){ pickFolder(); }
}
async function restoreFolder(){
  if (!FS_OK){ setLive('none'); return; }
  const h = await kvGet('dir-marges'); if (!h){ setLive('none'); return; }
  $('folder').textContent = h.name;
  let perm = 'prompt'; try{ perm = await h.queryPermission({mode:'read'}); }catch(e){}
  if (perm === 'granted'){ dirHandle = h; sync(); } else setLive('reconnect');
}
function addFiles(files){ for (const f of files) manual.set(f.name, f); lastSig=''; sync(); }

/* =================== agences =================== */
// agences rangées par compte : la personne suivante sur le même poste ne les voit pas
let groupsKey = null;
const newId = () => 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
function loadGroups(user){
  groupsKey = user ? 'marges-agences:' + user.id : null;
  groups = groupsKey ? lsGet(groupsKey, []) : [];
  if (F.groupe && !groupById(F.groupe)) F.groupe = '';
  render();
}
function saveGroups(){ if (groupsKey) lsSet(groupsKey, groups); }
function setMsg(id, txt, kind){ const el = $(id); if (!el) return; el.textContent = txt; el.className = 'msg' + (kind ? ' ' + kind : ''); }
let msgTimer = null;
function groupsMsg(txt, kind){ setMsg('groupsMsg', txt, kind); clearTimeout(msgTimer); if (txt) msgTimer = setTimeout(() => setMsg('groupsMsg',''), 6000); }
function saveEditor(){
  const name = ($('gName').value || '').trim();
  const members = [...document.querySelectorAll('.editor input[type=checkbox]:checked')].map(x=>x.value);
  if (!name){ setMsg('gMsg', 'Donne un nom à l\'agence.', 'err'); $('gName').focus(); return; }
  if (!members.length){ setMsg('gMsg', allRows().length ? 'Coche au moins un commercial.' : 'Importe d\'abord un export de marges pour choisir les commerciaux.', 'err'); return; }
  const isNew = !editing.id;
  if (editing.id){ const g = groupById(editing.id); g.name = name; g.members = members; }
  else groups.push({id: newId(), name, members});
  saveGroups(); editing = null; renderEditor(); render();
  groupsMsg(isNew ? `Agence « ${name} » créée (${members.length} commercial(aux)).` : `Agence « ${name} » mise à jour.`, 'ok');
}
// deux ensembles de commerciaux appartiennent à la même agence s'ils partagent au moins la moitié du plus petit
// (un commercial présent dans deux agences ne suffit pas à les fusionner)
const sameAgency = (a, b) => { const B = new Set(b); const n = a.filter(x => B.has(x)).length; return n > 0 && n * 2 >= Math.min(a.length, b.length); };
function autoGroups(){
  if (!datasets.some(d=>d.rows.length)){ groupsMsg('Importe d\'abord un export de marges.', 'err'); return; }
  // 1. regrouper les fichiers d'une même agence (un export par mois et par agence → une seule agence)
  let clusters = datasets.filter(d=>d.rows.length).map(d => ({members: uniqSorted(d.rows, comOf), files: [d.name.replace(/\.csv$/i,'').replace(/^.*\//,'')]}));
  for (let merged = true; merged; ){
    merged = false;
    outer: for (let i = 0; i < clusters.length; i++) for (let j = i + 1; j < clusters.length; j++){
      if (sameAgency(clusters[i].members, clusters[j].members)){
        clusters[i] = {members: [...new Set([...clusters[i].members, ...clusters[j].members])].sort((a,b)=>a.localeCompare(b,'fr')), files: clusters[i].files.concat(clusters[j].files)};
        clusters.splice(j, 1); merged = true; break outer;
      }
    }
  }
  // 2. agence déjà définie → on la complète avec les nouveaux commerciaux ; sinon on la crée
  const created = [], updated = [];
  for (const c of clusters){
    const g = groups.find(g => sameAgency(g.members, c.members));
    if (g){
      const add = c.members.filter(m => !g.members.includes(m));
      if (add.length){ updated.push({g, members: g.members.concat(add), label: `${g.name} (+${add.length})`}); }
      continue;
    }
    // nom proposé : noms de famille des commerciaux (à renommer ensuite, ex. « Pau »)
    const last = c.members.map(m => (m.split(' ').find(w => w.length > 1 && w === w.toUpperCase()) || m));
    const name = last.slice(0,3).join(' + ') + (last.length > 3 ? ` + ${last.length-3}` : '');
    created.push({id: newId() + created.length, name, members: c.members});
  }
  if (!created.length && !updated.length){ groupsMsg('Ces agences existent déjà (mêmes commerciaux).', 'err'); return; }
  for (const u of updated) u.g.members = u.members;
  groups = groups.concat(created); saveGroups(); render();
  groupsMsg([created.length ? `${created.length} agence(s) créée(s) — clique sur « Modifier » pour les renommer.` : '',
             updated.length ? `Commerciaux ajoutés : ${updated.map(u => u.label).join(', ')}.` : ''].filter(Boolean).join(' '), 'ok');
}

/* =================== événements =================== */
const bindF = (id,k) => $(id).addEventListener('change', e => { F[k] = e.target.value; render(); });
bindF('fMois','mois'); bindF('fGroupe','groupe'); bindF('fCom','com'); bindF('fDossier','dossier'); bindF('fClient','client'); bindF('fGC','gc');
$('clearBtn').onclick = () => { F = {mois:'', groupe:'', com:'', dossier:'', client:'', gc:''}; render(); };
$('etpBase').value = ETP_BASE;
$('etpBase').addEventListener('change', e => { const v = num(e.target.value); if (v > 0){ ETP_BASE = v; lsSet('marges-etp', v); render(); } else e.target.value = ETP_BASE; });
$('attrib').value = ATTRIB;
$('attrib').onchange = e => { ATTRIB = e.target.value; lsSet('marges-attrib', ATTRIB); F.com=''; render(); if (editing) renderEditor(); };
$('pickBtn').onclick = pickFolder; $('reconnectBtn').onclick = reconnect;
$('refreshBtn').onclick = () => $('dirInput').click();
$('addBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { addFiles([...e.target.files]); e.target.value=''; };
$('dirInput').onchange = e => { snapshotFiles = [...e.target.files]; dirHandle = null; lastSig=''; cache.clear(); $('folder').textContent = (snapshotFiles[0]?.webkitRelativePath||'').split('/')[0] || 'dossier'; e.target.value=''; sync(); };
$('newGroup').onclick = () => { editing = {id:null, name:'', members: F.com ? [F.com] : []}; renderEditor(); groupsMsg(''); };
$('autoGroups').onclick = autoGroups;
if (window.PilotageAuth) window.PilotageAuth.ready.then(info => loadGroups(info.user));
$('pdfBtn').onclick = () => { render(); setTimeout(() => window.print(), 50); };
$('pptxBtn').onclick = () => window.exportMargesPptx && window.exportMargesPptx();
$('themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur==='dark' ? 'light' : 'dark';
  try{ localStorage.setItem('stats-theme', document.documentElement.dataset.theme); }catch(e){}
};
try{ const t = localStorage.getItem('stats-theme'); if (t) document.documentElement.dataset.theme = t; }catch(e){}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'gCancel'){ editing = null; renderEditor(); return; }
  if (t.id === 'gSave'){ saveEditor(); return; }
  const ge = t.closest('[data-gedit]'); if (ge){ e.stopPropagation(); const g = groupById(ge.dataset.gedit); editing = {id:g.id, name:g.name, members:[...g.members]}; renderEditor(); $('editorBox').scrollIntoView({block:'nearest'}); return; }
  const gd = t.closest('[data-gdel]'); if (gd){
    const g = groupById(gd.dataset.gdel);
    if (gd.dataset.armed !== '1'){ gd.dataset.armed = '1'; gd.textContent = 'Confirmer la suppression'; setTimeout(() => { if (gd.isConnected){ gd.dataset.armed = ''; gd.textContent = 'Supprimer'; } }, 4000); return; }
    groups = groups.filter(x=>x.id!==g.id); if (F.groupe===g.id) F.groupe=''; saveGroups(); render(); groupsMsg(`Agence « ${g.name} » supprimée.`, 'ok'); return; }
  const gr = t.closest('[data-grp]'); if (gr){ F.groupe = F.groupe===gr.dataset.grp ? '' : gr.dataset.grp; render(); return; }
  const dm = t.closest('[data-dim]'); if (dm){ dim = dm.dataset.dim; lsSet('marges-dim', dim); showAll=false; render(); return; }
  const mt = t.closest('[data-metric]'); if (mt){ metric = mt.dataset.metric; lsSet('marges-metric', metric); sortKey='metric'; sortDir=-1; render(); return; }
  const bs = t.closest('[data-bsort]'); if (bs){ const k = bs.dataset.bsort; if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir = k==='label'?1:-1; } render(); return; }
  const bm = t.closest('[data-bmore]'); if (bm){ showAll = bm.dataset.bmore==='1'; render(); return; }
  const pk = t.closest('[data-pick]'); if (pk){
    const k = pk.dataset.pick, map = {groupe:'groupe', com:'com', dossier:'dossier', client:'client'};
    if (map[dim]){ F[map[dim]] = F[map[dim]]===k ? '' : k; render(); }
    return;
  }
});
const drop = $('drop');
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev==='drop' || !e.relatedTarget) drop.classList.remove('over'); }));
document.addEventListener('drop', e => { const fs=[...e.dataTransfer.files].filter(f=>EXT.test(f.name)); if (fs.length) addFiles(fs); });
window.addEventListener('beforeprint', render);

render();
restoreFolder();
setInterval(() => { if (dirHandle) sync(); }, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && dirHandle) sync(); });
</script>
